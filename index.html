<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cari Ibarot</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{color-scheme:light}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f7f8;color:#243746}
.ar{font-family:Georgia,'Times New Roman',serif;direction:rtl;line-height:2.15}
button{transition:background .18s,transform .18s}
button:active{transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.panel{background:#fff;border:1px solid #e1eaec;border-radius:18px;box-shadow:0 5px 22px #153b4b0a}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#0b7184}
.section-title{font-size:17px;font-weight:800;color:#183b49}
.result-card{background:white;border:1px solid #dce8ea;border-radius:16px;padding:17px;box-shadow:0 4px 16px #163c4a08}
.result-meta{font-size:12px;color:#647782}
.report-block{background:#fff;border:1px solid #dce8ea;border-radius:15px;padding:16px}
.report-block h3{font-size:15px;font-weight:800;color:#075b70;margin-bottom:8px}
.quote-card{background:#f8fbfb;border:1px solid #e0ebed;border-radius:13px;padding:13px;margin-top:9px}
.pill{display:inline-flex;align-items:center;border-radius:999px;background:#e8f5f6;color:#075b70;padding:4px 10px;font-size:11px;font-weight:700}
@media(max-width:480px){main{padding:12px!important}.result-card,.report-block{padding:13px}.ar{font-size:20px}}
</style>
</head>
<body class="min-h-screen">
<header class="bg-teal-800 text-white p-4 shadow">
 <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
  <div><h1 class="text-2xl font-bold">Cari Ibarot</h1><p class="text-sm text-teal-100">Pencari referensi kitab turats</p></div>
  <nav class="flex gap-2">
   <button type="button" data-tab="search" class="tab px-3 py-2 rounded bg-white/20">Cari Ibarot</button>
   <button type="button" data-tab="research" class="tab px-3 py-2 rounded">Riset & Tarjih</button>
  </nav>
 </div>
</header>
<main class="max-w-5xl mx-auto p-4 space-y-4">
<section id="page-search" class="space-y-4">
 <div class="bg-white rounded-xl shadow-sm p-5 space-y-4">
  <h2 class="font-bold text-lg">Pencarian langsung</h2>
  <label for="query" class="text-sm font-medium">Kata kunci Arab</label>
  <textarea id="query" rows="3" class="w-full border rounded-lg p-3" placeholder="Contoh: بيع الغرر"></textarea>
  <div class="flex flex-wrap gap-4 text-sm">
   <label><input id="shamela" type="checkbox" checked> Shamela</label>
   <label><input id="turath" type="checkbox" checked> Turath</label>
  </div>
  <button type="button" id="searchBtn" class="bg-teal-700 text-white rounded-lg px-5 py-3 font-semibold">Cari Ibarot</button>
  <p id="searchStatus" class="text-sm whitespace-pre-line"></p>
 </div>
 <div id="results" class="space-y-3"></div>
</section>
<section id="page-research" class="hidden space-y-4">
 <div class="bg-white rounded-xl shadow-sm p-5 space-y-4">
  <h2 class="font-bold text-lg">Riset fikih & tarjih</h2>
  <label for="question" class="text-sm font-medium">Masalah yang ingin dikaji</label>
  <textarea id="question" rows="3" class="w-full border rounded-lg p-3" placeholder="Contoh: Hukum menyewakan tanah untuk pertanian menurut empat madzhab"></textarea>
  <label class="text-sm">Madzhab</label>
  <select id="madhhab" class="border rounded-lg p-2 w-full">
   <option value="all">Perbandingan empat madzhab</option><option value="syafii">Syafi'i</option><option value="hanafi">Hanafi</option><option value="maliki">Maliki</option><option value="hambali">Hanbali</option>
  </select>
  <div class="flex flex-wrap gap-4 text-sm"><label><input id="rShamela" type="checkbox" checked> Shamela</label><label><input id="rTurath" type="checkbox" checked> Turath</label></div>
  <button type="button" id="researchBtn" class="bg-amber-600 text-white rounded-lg px-5 py-3 font-semibold">Mulai Riset & Tarjih</button>
  <p id="researchStatus" class="text-sm whitespace-pre-line"></p>
  <div id="terms" class="flex flex-wrap gap-2"></div>
 </div>
 <div id="report" class="space-y-3"></div>
</section>
</main>
<div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white rounded-lg px-4 py-3 hidden"></div>
<script>
'use strict';
const API={
 shamela:'https://cari-ibarot-api.ruangkonsultasijarakosta.workers.dev',
 ai:'https://cari-ibarot-ai.ruangkonsultasijarakosta.workers.dev',
 turath:'https://cari-ibarot-turath.ruangkonsultasijarakosta.workers.dev'
};
const $=id=>document.getElementById(id);
function toast(s){const e=$('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),3000)}
function status(id,s,error=false){$(id).textContent=s;$(id).className='text-sm whitespace-pre-line '+(error?'text-red-700':'text-slate-600')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
 const tab=b.dataset.tab;
 $('page-search').classList.toggle('hidden',tab!=='search');
 $('page-research').classList.toggle('hidden',tab!=='research');
 document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('bg-white/20',x===b));
}));
async function post(url,body){
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
 const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('Respons server bukan JSON (HTTP '+r.status+'): '+t.slice(0,180))}
 if(!r.ok)throw Error('HTTP '+r.status+': '+t.slice(0,250));
 if(j.error)throw Error(typeof j.error==='string'?j.error:(j.error.message||JSON.stringify(j.error)));
 return j;
}
function parseShamela(j,term){
 const rpc=j.result||j;
 if(rpc.isError)throw Error((rpc.content||[]).map(x=>x.text||'').join(' ')||'Pencarian Shamela gagal');
 let d=rpc.structuredContent||rpc.structured_content;
 if(!d&&Array.isArray(rpc.content)){const p=rpc.content.find(x=>x.type==='text'&&x.text);if(p){try{d=JSON.parse(p.text)}catch{}}}
 if(!d)throw Error('Format hasil Shamela tidak dikenali');
 return (d.passages||[]).map(h=>({source:'Shamela',book:h.book||'Kitab tidak disebutkan',author:h.author||'',where:'Jilid/Halaman: '+(h.printedPage||'tidak tersedia'),text:h.arabic||'',url:h.sourceUrl||'',term}));
}
function collectTurath(x,out=[],depth=0){
 if(!x||depth>5)return out;
 if(Array.isArray(x)){x.forEach(v=>collectTurath(v,out,depth+1));return out}
 if(typeof x==='object'){
  const txt=x.arabicText||x.arabic||x.text||x.pageText||x.page_text||x.passage||x.snippet||x.excerpt||x.content;
  if(typeof txt==='string'&&txt.trim()){
   const meta=x.book&&typeof x.book==='object'?x.book:(x.metadata&&typeof x.metadata==='object'?x.metadata:{});
   const book=x.bookTitle||x.book_title||x.bookName||x.book_name||x.kitab||x.title||x.work||meta.title||meta.name||(typeof x.book==='string'?x.book:'')||'Nama kitab tidak dikirim Turath';
   const author=x.authorName||x.author_name||x.author||x.writer||meta.author||'';
   const volume=x.volume||x.volumeNumber||x.volume_number||x.juz||x.juz_number||'';
   const page=x.page||x.pageNumber||x.page_number||x.pageNo||x.printedPage||'';
   out.push({source:'Turath',book:String(book),author:String(author),where:[volume?'Jilid '+volume:'',page?'Halaman '+page:''].filter(Boolean).join(' / ')||x.location||x.reference||x.tocPath||x.toc_path||'Lokasi tidak tersedia',text:txt,url:x.url||x.sourceUrl||x.source_url||x.link||'',term:'',bookId:x.bookId||x.book_id||meta.id||''});
  }
  else ['results','passages','items','hits','matches','data','books'].forEach(k=>{if(x[k])collectTurath(x[k],out,depth+1)});
 }
 return out;
}
async function searchOne(term,which,scope='fiqh-comparative'){
 const jobs=[];
 if(which.shamela)jobs.push(post(API.shamela,{query:term,scope,limit:5}).then(parseShamela).then(a=>a.map(x=>({...x,term}))));
 if(which.turath)jobs.push(post(API.turath,{query:term,limit:5}).then(j=>collectTurath(j.data||j.result||j).map(x=>({...x,term}))));
 const settled=await Promise.allSettled(jobs),items=[],errors=[];
 settled.forEach((r,i)=>{if(r.status==='fulfilled')items.push(...r.value);else errors.push((which.shamela&&i===0?'Shamela':'Turath')+': '+r.reason.message)});
 return {items,errors};
}
function render(items){
 $('results').innerHTML=items.map((x,i)=>`<article class="result-card space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-2"><span class="pill">${esc(x.source)}</span><span class="result-meta">${esc(x.where)}</span></div>
  <div><h3 class="font-bold text-slate-800">${esc(x.book)}</h3><p class="result-meta mt-1">${esc(x.author||'Pengarang tidak dicantumkan')}</p></div>
  <div class="ar text-[21px] text-slate-800 bg-slate-50 rounded-xl p-4">${esc(x.text)}</div>
  <div class="flex flex-wrap items-center gap-4 text-xs">
   <button type="button" class="copy font-semibold text-teal-700 underline" data-i="${i}">Salin ibarot</button>
   ${/^https:\/\//.test(x.url)?`<a class="font-semibold text-teal-700 underline" target="_blank" rel="noopener" href="${esc(x.url)}">Buka kitab di Turath</a>`:''}
  </div>
 </article>`).join('')||'<div class="panel p-5 text-sm text-slate-500">Tidak ada ibarot yang ditemukan.</div>';
 $('results').querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{const x=items[+b.dataset.i];try{await navigator.clipboard.writeText(x.text);toast('Ibarot disalin')}catch{toast('Gagal menyalin')}}));
}
$('searchBtn').addEventListener('click',async()=>{
 const q=$('query').value.trim(),which={shamela:$('shamela').checked,turath:$('turath').checked};
 if(!q){toast('Masukkan kata kunci Arab terlebih dahulu.');return}
 if(!which.shamela&&!which.turath){toast('Pilih minimal satu sumber.');return}
 const b=$('searchBtn');b.disabled=true;b.textContent='Mencari...';$('results').innerHTML='';
 try{status('searchStatus','Sedang mencari...');const r=await searchOne(q,which);render(r.items);status('searchStatus','Ditemukan '+r.items.length+' ibarot.'+(r.errors.length?'\n'+r.errors.join('\n'):''),!r.items.length);if(!r.items.length)toast('Ibarot tidak ditemukan')}
 catch(e){status('searchStatus',e.message,true);toast('Pencarian gagal')}
 finally{b.disabled=false;b.textContent='Cari Ibarot'}
});
async function ai(action,payload){
 const j=await post(API.ai,{action,...payload});
 let d=j.data||j.result||j.analysis||j;
 if(typeof d==='string'){try{d=JSON.parse(d)}catch{throw Error('Format respons AI tidak valid')}}
 return d;
}
function getTerms(d){
 const found=[],keys=['searchTermsArabic','searchPhrasesArabic','searchTerms','arabicSearchTerms','search_terms','arabic_terms','keywordsArabic','arabicKeywords','keywords','terms','queries'];
 const walk=(o,n=0)=>{if(!o||typeof o!=='object'||n>4)return;if(Array.isArray(o)){o.forEach(v=>walk(v,n+1));return}keys.forEach(k=>{const v=o[k];if(Array.isArray(v))found.push(...v);else if(typeof v==='string')found.push(...v.split(/[\n,;؛]/))});Object.values(o).forEach(v=>{if(v&&typeof v==='object')walk(v,n+1)})};
 walk(d);return [...new Set(found.map(v=>typeof v==='string'?v.trim():String(v?.termArabic||v?.term||v?.query||'').trim()).filter(v=>v&&/[\u0600-\u06FF]/.test(v)))].slice(0,8);
}
function renderTarjih(data,question,passages,ids){
 const root=$('report');
 const pick=(...keys)=>{for(const k of keys){const v=data?.[k];if(typeof v==='string'&&v.trim())return v.trim()}return ''};
 const heading=(title,body)=>body?`<section class="report-block"><h3>${esc(title)}</h3><div class="text-sm leading-7 text-slate-700 whitespace-pre-line">${esc(body)}</div></section>`:'';
 const evidenceFor=(raw)=>{
  const key=String(raw??'').trim();
  if(ids[key])return ids[key];
  const n=Number(key.replace(/[^0-9]/g,''));
  if(Number.isFinite(n)){
   if(ids['p'+n])return ids['p'+n];
   if(passages[n])return passages[n];
   if(n>0&&passages[n-1])return passages[n-1];
  }
  return null;
 };
 const evidenceHtml=(refs)=>{
  if(!Array.isArray(refs)||!refs.length)return '';
  return `<div class="mt-3"><div class="eyebrow mb-2">Referensi ibarot</div><div class="space-y-2">${refs.map(ref=>{
   const p=evidenceFor(ref);
   return p?`<div class="quote-card"><div class="font-bold text-sm text-slate-800">${esc(p.book||'Nama kitab tidak tersedia')}</div><div class="result-meta mt-1">${esc(p.author||'')} · ${esc(p.source||'Sumber')} · ${esc(p.where||'Lokasi tidak tersedia')}</div><div class="ar text-base mt-2 text-slate-700">${esc(p.text||'')}</div></div>`:`<div class="text-xs text-slate-500">ID referensi: ${esc(ref)} (metadata kitab tidak ditemukan dalam hasil pencarian)</div>`;
  }).join('')}</div></div>`;
 };
 const aqwal=Array.isArray(data?.aqwal)?data.aqwal:(Array.isArray(data?.opinions)?data.opinions:[]);
 const aqwalHtml=aqwal.map((a,i)=>`<section class="report-block">
  <div class="flex flex-wrap justify-between gap-2 mb-2"><h3 class="mb-0">Pendapat ${i+1} · ${esc(a.madhhab||a.school||'Pendapat ulama')}</h3><span class="pill">Pemetaan qaul</span></div>
  ${a.position?`<p class="text-sm leading-7 text-slate-700">${esc(a.position)}</p>`:''}
  ${a.explanation?`<p class="text-sm leading-7 text-slate-700 mt-2">${esc(a.explanation)}</p>`:''}
  ${evidenceHtml(a.evidenceIds||a.evidence_ids||a.references||a.sources)}
 </section>`).join('');
 const summary=pick('tahrirMahallNiza','tahrirMahallNiza','tahrir','problemFraming');
 const tashawwur=pick('tashawwur','description','problemDescription');
 const dalil=pick('dalil','evidence','evidenceAnalysis');
 const munaqasyah=pick('munaqasyah','discussion','criticalAnalysis');
 const tarjih=pick('tarjih','preferredView','tarjihResult','conclusion');
 const note=pick('notes','catatan','sourceAssessment');
 root.innerHTML=`<div class="space-y-3">
  <div class="rounded-2xl bg-gradient-to-br from-teal-800 to-cyan-900 text-white p-5">
   <div class="text-xs font-bold tracking-widest text-teal-100 uppercase">Laporan riset fikih</div>
   <h2 class="text-xl font-extrabold mt-2">${esc(question)}</h2>
   <p class="text-xs text-teal-100 mt-2">${passages.length} ibarot berhasil dihimpun</p>
  </div>
  ${heading('Tashawwur al-mas’alah',tashawwur)}
  ${heading('Tahrir mahal an-niza’',summary)}
  ${aqwalHtml}
  ${heading('Analisis dalil',dalil)}
  ${heading('Munaqasyah',munaqasyah)}
  ${heading('Kesimpulan / tarjih',tarjih)}
  ${heading('Catatan sumber',note)}
  ${!aqwalHtml&&!tashawwur&&!summary&&!dalil&&!munaqasyah&&!tarjih?heading('Hasil analisis',JSON.stringify(data,null,2)):''}
  <p class="text-xs text-slate-500 px-1">Rujukan kitab dan halaman ditampilkan berdasarkan metadata yang dikirim sumber Turath/Shamela. Tetap cocokkan kutipan dengan halaman kitab aslinya.</p>
 </div>`;
}
$('researchBtn').addEventListener('click',async()=>{
 const question=$('question').value.trim(),which={shamela:$('rShamela').checked,turath:$('rTurath').checked},madhhab=$('madhhab').value;
 if(!question){toast('Tuliskan masalah fikih terlebih dahulu.');return}
 if(!which.shamela&&!which.turath){toast('Pilih minimal satu sumber.');return}
 const b=$('researchBtn');b.disabled=true;b.textContent='Memproses...';$('report').textContent='';$('terms').innerHTML='';
 try{
  status('researchStatus','Tahap 1/3: menyusun kata kunci Arab...');
  const research=await ai('research',{question,madhhab}),terms=getTerms(research);
  if(!terms.length)throw Error('AI tidak mengembalikan kata kunci Arab. Periksa Worker AI.');
  $('terms').innerHTML=terms.map(t=>`<span class="ar bg-teal-50 text-teal-800 rounded px-3 py-1">${esc(t)}</span>`).join('');
  const scopes={all:'fiqh-comparative',syafii:'fiqh-shafii',hanafi:'fiqh-hanafi',maliki:'fiqh-maliki',hambali:'fiqh-hanbali'};
  let passages=[],errors=[];
  for(const term of terms){status('researchStatus','Tahap 2/3: mencari '+term+' ...');const r=await searchOne(term,which,scopes[madhhab]);passages.push(...r.items);errors.push(...r.errors)}
  const seen=new Set();passages=passages.filter(p=>p.text&&!seen.has(p.text.replace(/\s/g,'').slice(0,250))&&seen.add(p.text.replace(/\s/g,'').slice(0,250)));
  if(!passages.length)throw Error('Tidak ditemukan ibarot.\n'+errors.join('\n'));
  status('researchStatus','Ditemukan '+passages.length+' ibarot. Tahap 3/3: menyusun analisis...');
  const passageIds={};
  const report=await ai('tarjih',{question,searchTerms:terms,passages:passages.map((p,i)=>{const id='p'+i;passageIds[id]=p;passageIds['p'+(i+1)]=passageIds['p'+(i+1)]||p;return {id,book:p.book,author:p.author,madhhab:p.source,page:p.where,arabicText:p.text,sourceUrl:p.url,searchTerm:p.term}})});
  renderTarjih(report,question,passages,passageIds);
  render(passages);status('researchStatus','Selesai. '+passages.length+' ibarot ditemukan.'+(errors.length?'\nSebagian pencarian gagal:\n'+errors.join('\n'):''));
 }catch(e){status('researchStatus','Proses belum selesai: '+e.message,true);toast('Riset gagal')}
 finally{b.disabled=false;b.textContent='Mulai Riset & Tarjih'}
});
</script>
</body></html>
