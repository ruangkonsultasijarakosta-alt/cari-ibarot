
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
 --primary:#104b55;
 --primary2:#087783;
 --paper:#f4f8f8;
 --ink:#18343d;
 --muted:#647982;
 --line:#dce8e9;
}
*{box-sizing:border-box}
body{

}
button,input,select,textarea{font:inherit}

button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.shell{width:min(960px,calc(100% - 28px));margin:auto}
header{

nav{display:flex;gap:7px}

}

main{padding:24px 0 45px}
.panel{

h2{font-size:20px;margin:0;color:#173e49}

.field:focus{

}
textarea{resize:vertical;min-height:90px}
label{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.primary-btn,.gold-btn{
 border:0;
 border-radius:11px;
 padding:13px 18px;
 font-weight:800;
 color:white;
}
.primary-btn{background:#0d6874}
.gold-btn{background:#a96516}
.primary-btn:hover{background:#095661}
.gold-btn:hover{background:#8d5010}
.checks{display:flex;flex-wrap:wrap;gap:18px}

 -webkit-box-decoration-break:clone;
}

 .shell{width:calc(100% - 22px)}

 header h1{font-size:21px}

<body>

<header>
 <div class="shell header-inner">
  <div>
   <h1>Cari Ibarot</h1>

  </div>
  <nav>
   <button class="tab active" data-tab="search">Cari Ibarot</button>
   <button class="tab" data-tab="research">Riset & Tarjih</button>
  </nav>

</header>

<main class="shell">

<section id="page-search" class="space">

 <div class="panel space">
  <h2>Pencarian langsung</h2>

  <div class="space" style="gap:7px">
   <label for="madhhab">Pilih Madzhab Pencarian</label>
   <select id="madhhab" class="field">
    <option value="all">Semua Madzhab</option>
    <option value="hanafi">Hanafi</option>
    <option value="maliki">Maliki</option>

    <option value="hambali">Hanbali</option>
   </select>
   <p class="hint">
    Pilihan ini digunakan untuk pencarian langsung dan Riset & Tarjih.
   </p>
  </div>

  <div class="space" style="gap:7px">

  </div>

  <div class="checks">
   <label><input id="shamela" type="checkbox" checked> Shamela</label>

<section id="page-research" class="space hidden">

 <div class="panel space">
  <h2>Riset Fikih & Tarjih</h2>

  <div class="space" style="gap:7px">

   <textarea id="question" class="field"
    placeholder="Contoh: Hukum menyewakan tanah untuk pertanian menurut empat madzhab"></textarea>
  </div>

  <div class="space" style="gap:7px">
   <label>Sumber pencarian</label>
   <div class="checks">
    <label><input id="rShamela" type="checkbox" checked> Shamela</label>
    <label><input id="rTurath" type="checkbox" checked> Turath</label>
   </div>
  </div>

  <p class="hint">
   Madzhab mengikuti pilihan pada halaman Cari Ibarot.
  </p>

  <button id="researchBtn" class="gold-btn">Mulai Riset & Tarjih</button>
  <p id="researchStatus" class="status"></p>
  <div id="terms" class="checks"></div>
 </div>

 <div id="report" class="space"></div>
</section>

</main>

<div id="toast" class="hidden"></div>

<script>
'use strict';

const API={
 shamela:'https://cari-ibarot-api.ruangkonsultasijarakosta.workers.dev',
 ai:'https://cari-ibarot-ai.ruangkonsultasijarakosta.workers.dev',
 turath:'https://cari-ibarot-turath.ruangkonsultasijarakosta.workers.dev'
};

const $=id=>document.getElementById(id);

const MADHHAB_SCOPES={
 all:'fiqh-comparative',
 hanafi:'fiqh-hanafi',
 maliki:'fiqh-maliki',
 syafii:'fiqh-shafii',
 hambali:'fiqh-hanbali'
};

function currentMadhhab(){
 return $('madhhab').value;
}

function toast(s){
 const e=$('toast');
 e.textContent=s;
 e.classList.remove('hidden');
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>e.classList.add('hidden'),3000);
}

function status(id,s,error=false){
 $(id).textContent=s;
 $(id).className='status'+(error?' error':'');
}

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function highlightIbarot(text,term){
 let safe=esc(text||'');

 const words=String(term||'')
  .split(/[،,؛;\n]+/)
  .map(x=>x.trim())
  .filter(x=>x.length>1)
  .sort((a,b)=>b.length-a.length);

 if(!words.length)return safe;

 const escaped=words.map(x=>
  x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')
 );

 try{
  const regex=new RegExp('('+escaped.join('|')+')','giu');
  return safe.replace(regex,
   '<mark class="ibarot-highlight">$1</mark>'
  );
 }catch{
  return safe;
 }
}

/* TAB */
document.querySelectorAll('[data-tab]').forEach(b=>{
 b.addEventListener('click',()=>{
  const tab=b.dataset.tab;

  $('page-search').classList.toggle('hidden',tab!=='search');
  $('page-research').classList.toggle('hidden',tab!=='research');

  document.querySelectorAll('[data-tab]').forEach(x=>{
   x.classList.toggle('active',x===b);
  });
 });
});

/* REQUEST */
async function post(url,body){
 const r=await fetch(url,{
  method:'POST',
  headers:{
   'Content-Type':'application/json',
   'Accept':'application/json'
  },
  body:JSON.stringify(body)
 });

 const t=await r.text();
 let j;

 try{
  j=JSON.parse(t);
 }catch{
  throw Error('Respons server bukan JSON (HTTP '+r.status+'): '+t.slice(0,180));
 }

 if(!r.ok){
  throw Error('HTTP '+r.status+': '+t.slice(0,250));
 }

 if(j.error){
  throw Error(typeof j.error==='string'
   ?j.error
   :(j.error.message||JSON.stringify(j.error)));
 }

 return j;
}

/* SHAMELA */
function parseShamela(j,term){
 const rpc=j.result||j;

 if(rpc.isError){
  throw Error((rpc.content||[]).map(x=>x.text||'').join(' ')||'Pencarian Shamela gagal');
 }

 let d=rpc.structuredContent||rpc.structured_content;

 if(!d&&Array.isArray(rpc.content)){
  const p=rpc.content.find(x=>x.type==='text'&&x.text);
  if(p){
   try{d=JSON.parse(p.text)}catch{}
  }
 }

 if(!d)throw Error('Format hasil Shamela tidak dikenali');

 return (d.passages||[]).map(h=>({
  source:'Shamela',
  book:h.book||'Kitab tidak disebutkan',
  author:h.author||'',
  where:'Jilid/Halaman: '+(h.printedPage||'tidak tersedia'),
  text:h.arabic||'',
  url:h.sourceUrl||'',
  term
 }));
}

/* TURATH */
function collectTurath(x,out=[],depth=0){
 if(!x||depth>5)return out;

 if(Array.isArray(x)){
  x.forEach(v=>collectTurath(v,out,depth+1));
  return out;
 }

 if(typeof x==='object'){
  const txt=x.arabicText||x.arabic||x.text||
   x.pageText||x.page_text||x.passage||
   x.snippet||x.excerpt||x.content;

  if(typeof txt==='string'&&txt.trim()){
   const meta=x.book&&typeof x.book==='object'
    ?x.book
    :(x.metadata&&typeof x.metadata==='object'?x.metadata:{});

   const book=x.bookTitle||x.book_title||x.bookName||
    x.book_name||x.kitab||x.title||x.work||meta.title||
    meta.name||(typeof x.book==='string'?x.book:'')||
    x.book_name_ar||x.workTitle||
    'Nama kitab tidak dikirim Turath';

   const author=x.authorName||x.author_name||x.author||
    x.writer||meta.author||meta.authorName||x.musannif||'';

   const volume=x.volume||x.volumeNumber||
    x.volume_number||x.juz||x.juz_number||x.vol||'';

   const page=x.page||x.pageNumber||x.page_number||
    x.pageNo||x.printedPage||x.pageno||'';

   out.push({
    source:'Turath',
    book:String(book),
    author:String(author),
    where:[
     volume?'Jilid '+volume:'',
     page?'Halaman '+page:''
    ].filter(Boolean).join(' / ')||
     x.location||x.reference||x.tocPath||x.toc_path||
     'Lokasi tidak tersedia',
    text:txt,
    url:x.url||x.sourceUrl||x.source_url||x.link||'',
    term:'',
    bookId:x.bookId||x.book_id||meta.id||''
   });
  }else{
   ['results','passages','items','hits','matches','data','books']
    .forEach(k=>{
     if(x[k])collectTurath(x[k],out,depth+1);
    });
  }
 }

 return out;
}

/* PENCARIAN DENGAN PARAMETER MADZHAB */
async function searchOne(term,which,scope,madhhab){
 const jobs=[];

 if(which.shamela){
  jobs.push(
   post(API.shamela,{
    query:term,
    scope,
    madhhab,
    limit:5
   }).then(j=>parseShamela(j,term))
  );
 }

 if(which.turath){
  jobs.push(
   post(API.turath,{
    query:term,
    scope,
    madhhab,
    limit:5
   }).then(j=>
    collectTurath(j.data||j.result||j)
     .map(x=>({...x,term}))
   )
  );
 }

 const settled=await Promise.allSettled(jobs);
 const items=[],errors=[];

 settled.forEach((r,i)=>{
  if(r.status==='fulfilled'){
   items.push(...r.value);
  }else{
   errors.push(
    (which.shamela&&i===0?'Shamela':'Turath')+
    ': '+r.reason.message
   );
  }
 });

 return {items,errors};
}

/* RENDER HASIL */
function render(items){
 $('results').innerHTML=items.map((x,i)=>`
  <article class="result-card space">

   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <span class="pill">${esc(x.source)}</span>
    <span class="result-meta">${esc(x.where)}</span>
   </div>

   <div>
    <h3 class="book-title">${esc(x.book)}</h3>
    <p class="book-meta">${esc(x.author||'Pengarang tidak dicantumkan')}</p>
   </div>

   <div class="ar" style="font-size:21px;background:#f7fbfb;padding:15px;border-radius:12px">
    ${highlightIbarot(x.text,x.term)}
   </div>

   <div style="display:flex;gap:17px;flex-wrap:wrap;font-size:12px">
    <button type="button" class="copy" data-i="${i}"
     style="color:#087783;text-decoration:underline;font-weight:bold">
     Salin ibarot
    </button>

    ${String(x.url||'').startsWith('https://')?`
     <a target="_blank" rel="noopener"
      style="color:#087783;text-decoration:underline;font-weight:bold"
      href="${esc(x.url)}">Buka kitab</a>`:''}
   </div>
  </article>
 `).join('')||`
  <div class="panel">
   <p class="hint">Tidak ada ibarot yang ditemukan.</p>
  </div>
 `;

 $('results').querySelectorAll('.copy').forEach(b=>{
  b.addEventListener('click',async()=>{
   const x=items[Number(b.dataset.i)];

   try{
    await navigator.clipboard.writeText(x.text);
    toast('Ibarot disalin');
   }catch{
    toast('Gagal menyalin');
   }
  });
 });
}

/* CARI IBAROT */
$('searchBtn').addEventListener('click',async()=>{
 const q=$('query').value.trim();
 const madhhab=currentMadhhab();

 const which={
  shamela:$('shamela').checked,
  turath:$('turath').checked
 };

 if(!q)return toast('Masukkan kata kunci Arab terlebih dahulu.');
 if(!which.shamela&&!which.turath)return toast('Pilih minimal satu sumber.');

 const b=$('searchBtn');
 b.disabled=true;
 b.textContent='Mencari...';
 $('results').innerHTML='';

 try{
  status('searchStatus','Sedang mencari ibarot...');

  const r=await searchOne(
   q,
   which,
   MADHHAB_SCOPES[madhhab],
   madhhab
  );

  render(r.items);

  status(
   'searchStatus',
   'Madzhab: '+madhhab+
   '\nDitemukan '+r.items.length+' ibarot.'+
   (r.errors.length?'\n'+r.errors.join('\n'):''),
   !r.items.length
  );

 }catch(e){
  status('searchStatus',e.message,true);
  toast('Pencarian gagal');
 }finally{
  b.disabled=false;
  b.textContent='Cari Ibarot';
 }
});

/* AI */
async function ai(action,payload){
 const j=await post(API.ai,{action,...payload});
 let d=j.data||j.result||j.analysis||j;

 if(typeof d==='string'){
  try{d=JSON.parse(d)}
  catch{throw Error('Format respons AI tidak valid')}
 }

 return d;
}

/* EKSTRAK KATA KUNCI */
function getTerms(d){
 const found=[];
 const keys=[
  'searchTermsArabic','searchPhrasesArabic','searchTerms',
  'arabicSearchTerms','search_terms','arabic_terms',
  'keywordsArabic','arabicKeywords','keywords','terms','queries'
 ];

 const walk=(o,n=0)=>{
  if(!o||typeof o!=='object'||n>4)return;

  if(Array.isArray(o)){
   o.forEach(v=>walk(v,n+1));
   return;
  }

  keys.forEach(k=>{
   const v=o[k];
   if(Array.isArray(v))found.push(...v);
   else if(typeof v==='string')found.push(...v.split(/[\n,;؛]/));
  });

  Object.values(o).forEach(v=>{
   if(v&&typeof v==='object')walk(v,n+1);
  });
 };

 walk(d);

 return [...new Set(found.map(v=>
  typeof v==='string'
   ?v.trim()
   :String(v?.termArabic||v?.term||v?.query||'').trim()
 ).filter(v=>v&&/[\u0600-\u06FF]/.test(v)))].slice(0,8);
}

/* NORMALISASI LAPORAN */
function unwrapReport(value){
 let d=value;

 for(let i=0;i<5;i++){
  if(typeof d==='string'){
   try{d=JSON.parse(d);continue}
   catch{return {conclusion:d}}
  }

  if(!d||typeof d!=='object'||Array.isArray(d))break;

  if(d.aqwal||d.opinions||d.tashawwur||
     d.tahrirMahallNiza||d.tarjih||d.conclusion)break;

  const next=d.data??d.result??d.analysis??d.report??d.output;
  if(next===undefined||next===d)break;
  d=next;
 }

 return d&&typeof d==='object'?d:{conclusion:String(d??'')};
}

/* RENDER TARJIH */
function renderTarjih(data,question,passages,ids){
 const root=$('report');
 const d=unwrapReport(data);

 const pick=(...keys)=>{
  for(const k of keys){
   const v=d?.[k];
   if(typeof v==='string'&&v.trim())return v.trim();

   if(Array.isArray(v)&&v.length){
    return v.map(x=>typeof x==='string'?x:JSON.stringify(x)).join('\n');
   }
  }
  return '';
 };

 const heading=(title,body)=>body?`
  <section class="report-block">
   <h3>${esc(title)}</h3>
   <div class="report-text">${esc(body)}</div>
  </section>`:'';

 const evidenceFor=raw=>{
  const key=String(raw??'').trim();

  if(Object.prototype.hasOwnProperty.call(ids,key))return ids[key];

  const n=Number(key.replace(/^p/i,''));

  if(/^p\d+$/i.test(key)&&Number.isInteger(n))return passages[n];

  if(/^\d+$/.test(key)&&Number.isInteger(n)){
   return passages[n]||passages[n-1]||null;
  }

  return passages.find(p=>p.id===key||p.sourceId===key)||null;
 };

 const refsOf=a=>
  a.evidenceIds||a.evidence_ids||a.references||
  a.sources||a.evidence||[];

 const evidenceHtml=refs=>{
  if(!Array.isArray(refs)){
   refs=typeof refs==='string'
    ?refs.split(/[;,\s]+/).filter(Boolean)
    :[];
  }

  if(!refs.length)return '';

  return `
   <div style="margin-top:15px">
    <div class="opinion-label" style="margin-bottom:8px">Kitab dan sumber rujukan</div>
    ${refs.map(ref=>{
     const p=evidenceFor(
      typeof ref==='object'?(ref.id||ref.refId||ref.sourceId):ref
     );

     if(!p){
      return `<div class="quote-card hint">Referensi ${esc(typeof ref==='object'?ref.id:ref)} tidak cocok dengan hasil pencarian.</div>`;
     }

     return `
      <article class="quote-card">
       <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <span class="pill">${esc(p.source||'Sumber')}</span>
        <span class="result-meta">${esc(p.where||'Lokasi tidak tersedia')}</span>
       </div>

       <div class="book-title" style="margin-top:9px">
        ${esc(p.book||'Nama kitab tidak tersedia')}
       </div>

       <div class="book-meta">
        ${esc(p.author||'Pengarang tidak dicantumkan')}
       </div>

       ${p.text?`
        <div class="ar ar-quote">
         ${highlightIbarot(p.text,p.term)}
        </div>`:''}

       ${String(p.url||'').startsWith('https://')?`
        <a href="${esc(p.url)}" target="_blank" rel="noopener"
         style="display:inline-block;margin-top:12px;color:#087783;font-size:12px;font-weight:bold">
         Buka referensi asli
        </a>`:''}
      </article>
     `;
    }).join('')}
   </div>`;
 };

 const aqwal=Array.isArray(d.aqwal)?d.aqwal:
  (Array.isArray(d.opinions)?d.opinions:[]);

 const aqwalHtml=aqwal.map((a,i)=>`
  <section class="report-block">
   <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <span class="opinion-label">Pendapat ${i+1}</span>

   ${a.position||a.opinion||a.view?`
    <div class="report-text">${esc(a.position||a.opinion||a.view)}</div>`:''}

   ${a.explanation||a.reasoning?`
    <div class="report-text" style="margin-top:10px">${esc(a.explanation||a.reasoning)}</div>`:''}

   ${evidenceHtml(refsOf(a))}
  </section>
 `).join('');

 const tashawwur=pick('tashawwur','description','problemDescription','tasawwur');
 const tahrir=pick('tahrirMahallNiza','tahrir','problemFraming','mahallNiza');
 const dalil=pick('dalil','evidence','evidenceAnalysis');
 const munaqasyah=pick('munaqasyah','discussion','criticalAnalysis');
 const tarjih=pick('tarjih','preferredView','tarjihResult');
 const conclusion=pick('conclusion','kesimpulan','summary');
 const note=pick('notes','catatan','sourceAssessment');
 const generic=pick('answer','resultText','analysisText');

 root.innerHTML=`
  <div class="space">

   <div class="report-hero">
    <div class="opinion-label" style="color:#d3eeee">Laporan riset fikih</div>

    <p>${passages.length} ibarot berhasil dihimpun.</p>
   </div>

   ${heading('Tashawwur al-Mas’alah',tashawwur)}
   ${heading('Tahrir Mahall an-Niza’',tahrir)}

   ${aqwalHtml?`
    <div class="space">
     <h2>Pemetaan Pendapat Ulama</h2>

   ${heading('Analisis Dalil',dalil)}

   ${!aqwalHtml&&!tashawwur&&!tahrir&&!dalil&&!munaqasyah&&!tarjih&&!conclusion
    ?heading('Hasil Analisis',generic||JSON.stringify(d,null,2))
    :''}

   <p class="hint">
    Metadata kitab, pengarang, jilid, dan halaman ditampilkan sesuai data yang dikirim sumber.
    Informasi yang tidak tersedia tidak dikarang.
   </p>
  </div>
 `;
}

/* RISET & TARJIH */
$('researchBtn').addEventListener('click',async()=>{
 const question=$('question').value.trim();
 const madhhab=currentMadhhab();

 const which={
  shamela:$('rShamela').checked,
  turath:$('rTurath').checked
 };

 if(!question)return toast('Tuliskan masalah fikih terlebih dahulu.');
 if(!which.shamela&&!which.turath)return toast('Pilih minimal satu sumber.');

 const b=$('researchBtn');
 b.disabled=true;
 b.textContent='Memproses...';

 $('report').innerHTML='';
 $('terms').innerHTML='';

 try{
  status('researchStatus','Tahap 1/3: menyusun kata kunci Arab...');

  const research=await ai('research',{
   question,
   madhhab,
   scope:MADHHAB_SCOPES[madhhab]
  });

  const terms=getTerms(research);

  if(!terms.length){
   throw Error('AI tidak mengembalikan kata kunci Arab. Periksa Worker AI.');
  }

  $('terms').innerHTML=terms.map(t=>`
   <span class="ar pill">${esc(t)}</span>
  `).join('');

  let passages=[];
  let errors=[];

  for(const term of terms){
   status('researchStatus','Tahap 2/3: mencari '+term+' ...');

   const r=await searchOne(
    term,
    which,
    MADHHAB_SCOPES[madhhab],
    madhhab
   );

   passages.push(...r.items);
   errors.push(...r.errors);
  }

  const seen=new Set();

  passages=passages.filter(p=>{
   const key=(p.text||'').replace(/\s/g,'').slice(0,250);
   if(!key||seen.has(key))return false;
   seen.add(key);
   return true;
  });

  if(!passages.length){
   throw Error(
    'Tidak ditemukan ibarot.'+
    (errors.length?'\n'+errors.join('\n'):'')
   );
  }

  status('researchStatus','Ditemukan '+passages.length+' ibarot. Menyusun analisis...');

  const passageIds={};

  const report=await ai('tarjih',{
   question,
   madhhab,
   searchTerms:terms,
   passages:passages.map((p,i)=>{
    const id='p'+i;
    passageIds[id]=p;

    return {
     id,
     book:p.book,
     author:p.author,
     source:p.source,
     madhhab:p.madhhab||'Belum Teridentifikasi',
     page:p.where,
     arabicText:p.text,
     sourceUrl:p.url,
     searchTerm:p.term
    };
   })
  });

  renderTarjih(report,question,passages,passageIds);

  status(
   'researchStatus',
   'Selesai. '+passages.length+' ibarot ditemukan.'+
   (errors.length?'\nSebagian pencarian gagal:\n'+errors.join('\n'):'')
  );

 }catch(e){
  status('researchStatus','Proses belum selesai: '+e.message,true);
  toast('Riset gagal');
 }finally{
  b.disabled=false;
  b.textContent='Mulai Riset & Tarjih';
 }
});
</script>
